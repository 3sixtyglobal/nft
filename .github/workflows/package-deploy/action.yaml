name: 'Package Deploy'
description: 'Perform any operations that require some deployment tasks. See deploy-config.json.example for details on the structure of the input data.'

inputs:
  branch:
    description: 'The branch the deployment is being performed on.'
    required: true
  branch-name:
    description: 'The full name of the branch the deployment is being created in.'
    required: true
  deploy-config-json:
    description: 'The configuration to use when deploying, stored as JSON.'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Download IOTA CLI
      shell: bash
      run: |
        cd ..
        wget https://github.com/iotaledger/iota/releases/download/v1.17.2/iota-v1.17.2-linux-x86_64.tgz -O iota-cli.tgz
        tar xzf iota-cli.tgz
        rm iota-cli.tgz
        chmod +x iota
        sudo mv iota /usr/local/bin/iota
        iota --version

    - name: Setup NFT contracts for mainnet
      shell: bash
      run: |
        cd packages/nft-connector-iota
        export DEPLOYER_MNEMONIC=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.mainnet.mnemonic')
        export RPC_URL=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.mainnet.nodeUrl')
        export NETWORK=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.mainnet.network')
        export ADDRESS_INDEX=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.mainnet.addressIndex // 0')
        export GAS_BUDGET=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.mainnet.gasBudget // 100000000')
        export RPC_TIMEOUT=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.mainnet.rpcTimeout // 60000')
        export CONFIRMATION_TIMEOUT=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.mainnet.confirmationTimeout // 120')
        ../../node_modules/.bin/move-to-json build "src/contracts/**/*.move" --output src/contracts/smart-contract-deployments/smart-contract-deployments.json
        ../../node_modules/.bin/move-to-json deploy --contracts src/contracts/smart-contract-deployments/smart-contract-deployments.json

    - name: Setup NFT contracts for testnet
      shell: bash
      run: |
        cd packages/nft-connector-iota
        export DEPLOYER_MNEMONIC=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.testnet.mnemonic')
        export RPC_URL=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.testnet.nodeUrl')
        export NETWORK=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.testnet.network')
        export ADDRESS_INDEX=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.testnet.addressIndex // 0')
        export GAS_BUDGET=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.testnet.gasBudget // 50000000')
        export RPC_TIMEOUT=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.testnet.rpcTimeout // 60000')
        export CONFIRMATION_TIMEOUT=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.testnet.confirmationTimeout // 60')
        export FAUCET_URL=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.testnet.faucetUrl // "https://faucet.testnet.iota.cafe"')
        ../../node_modules/.bin/move-to-json build "src/contracts/**/*.move" --output src/contracts/smart-contract-deployments/smart-contract-deployments.json
        ../../node_modules/.bin/move-to-json deploy --contracts src/contracts/smart-contract-deployments/smart-contract-deployments.json

    - name: Setup NFT contracts for devnet
      shell: bash
      run: |
        cd packages/nft-connector-iota
        export DEPLOYER_MNEMONIC=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.devnet.mnemonic')
        export RPC_URL=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.devnet.nodeUrl')
        export NETWORK=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.devnet.network')
        export ADDRESS_INDEX=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.devnet.addressIndex // 0')
        export GAS_BUDGET=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.devnet.gasBudget // 50000000')
        export RPC_TIMEOUT=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.devnet.rpcTimeout // 60000')
        export CONFIRMATION_TIMEOUT=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.devnet.confirmationTimeout // 60')
        export FAUCET_URL=$(echo '${{ inputs.deploy-config-json }}' | jq -r '.devnet.faucetUrl // "https://faucet.devnet.iota.cafe"')
        ../../node_modules/.bin/move-to-json build "src/contracts/**/*.move" --output src/contracts/smart-contract-deployments/smart-contract-deployments.json
        ../../node_modules/.bin/move-to-json deploy --contracts src/contracts/smart-contract-deployments/smart-contract-deployments.json
